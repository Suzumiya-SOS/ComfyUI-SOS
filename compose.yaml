name: comfyui-master

services:
  comfyui:
    image: comfyui-sos-comfyui:master-20261022
    container_name: comfyui-master
    build:
      context: .
      args:
        COMFYUI_REVISION: 7a28332047b6af638dc6c7f72ef3481a718769fd
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /app/previews:size=256m,mode=1777
    restart: unless-stopped
    gpus: all
    shm_size: 2gb
    ports:
      - "${COMFYUI_HOST_PORT:-8189}:8188"
    environment:
      XDG_CACHE_HOME: /app/user/cache
      HF_HOME: /app/user/cache/huggingface
      PYTHONNOUSERSITE: "1"
      WAS_BLOCK_AUTO_INSTALL: "true"
      PIP_NO_INDEX: "1"
    volumes:
      - /opt/ComfyUI-SOS/models:/app/models:ro
      - /opt/ComfyUI-SOS/input:/app/input
      - /opt/ComfyUI-SOS/output:/app/output
      - ./user:/app/user
      - ./custom_nodes:/app/custom_nodes:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
